server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache immutable hashed assets emitted by the React build.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback -> index.html for any non-file path (including /).
    # Also serves the self-hosted pdf.js worker (pdf.worker.mjs) by name.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
